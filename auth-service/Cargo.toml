[package]
name = "auth-service"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["backend-bergshamra"]

# XML-DSig signing/verification backend (mutually exclusive; exactly one).
# `backend-bergshamra` is the pure-Rust default, shipped in the binary with no
# system dependency. `backend-xmlsec` swaps sign/verify to libxmlsec1 (the
# reference C implementation) via the minimal `xmlsec-mini-sys` FFI; build it
# with `--no-default-features --features backend-xmlsec`. XML-Enc decryption
# always uses `bergshamra-enc` regardless of this choice.
backend-bergshamra = ["dep:bergshamra-dsig"]
backend-xmlsec = ["dep:xmlsec-mini-sys"]

# Talk to the online TVS mock service: default `TVS_ENV` to `test` and `BASE_URL`
# to `http://localhost:3000`, and embed the committed DV cert/key bundle
# (`auth-service/fixtures`)
tvs-mock = []

[dependencies]
# XML-Enc (decryption) + key loading: always required, both backends use these.
bergshamra-enc  = "0.8"
bergshamra-keys = "0.8"
# XML-DSig backends (feature-gated, optional): exactly one is compiled in.
bergshamra-dsig = { version = "0.8", optional = true }
xmlsec-mini-sys = { path = "../xmlsec-mini-sys", optional = true }
cookie = "0.18"
base64 = "0.22"
sha1 = "0.11"
roxmltree = "0.21"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-pki-types = "1"
x509-cert = "0.2"

axum = { workspace = true, features = ["macros"] }
axum-extra = { workspace = true, features = ["typed-routing"] }
tokio = { workspace = true }
askama = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["form", "rustls"] }
tracing = { workspace = true }
thiserror = { workspace = true }
